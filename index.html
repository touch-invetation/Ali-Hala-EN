main{max-width:520px;margin:0 auto;padding:0 22px 60px}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 0;gap:22px}
.rev{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s ease}
.rev.on{opacity:1;transform:none}
.logo{width:150px}
.date-en{font-family:'Lora',serif;letter-spacing:.35em;font-size:22px}
.orn{width:90px;height:1px;background:var(--line);margin:4px auto}
.verse{font-size:27px}
.small{font-size:22px;color:var(--ink2)}
.fam{font-size:31px;line-height:1.5}
.and{font-size:24px}
.names{width:min(300px,72vw)}
.dua{width:min(440px,92vw)}
.maps{width:min(200px,50vw)}
.tag{font-size:28px;line-height:1.5}
.tl{position:relative;display:grid;gap:44px;margin-top:8px}
.tl:before{content:"";position:absolute;top:30px;bottom:30px;left:50%;width:2px;background:var(--line);transform:translateX(-50%)}
.row{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:14px}
.ic{width:64px;height:64px;border-radius:50%;background:var(--paper);display:grid;place-items:center;position:relative;z-index:1}
.ic svg{width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:22px;line-height:1.5}
.lbl b{display:block;font-weight:400;font-size:24px}
.lbl .en{font-family:'Lora',serif;font-size:14px;white-space:nowrap;line-height:1.5;direction:ltr;display:block}
.r{text-align:right}.l{text-align:left}
a.btn,button.btn{font-family:'Cormorant Garamond','Lora',serif;font-size:21px;color:#f6f2ee;background:var(--ink);border:0;border-radius:40px;padding:11px 28px;text-decoration:none;cursor:pointer;display:inline-block;transition:transform .2s,opacity .2s}
button.btn:disabled{opacity:.6;cursor:default}
a.btn:hover,button.btn:hover{transform:translateY(-2px)}
a.ghost,button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.cd{display:flex;gap:14px;direction:rtl;justify-content:center}
.cd div{min-width:64px;padding:10px 6px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.cd span{display:block;font-family:'Lora',serif;font-size:26px}
.cd small{font-size:15px;color:var(--ink2)}
.note{display:flex;flex-direction:column;align-items:center;gap:10px}
.note svg{width:70px;height:70px;stroke:var(--ink);stroke-width:2.2;fill:none}
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;display:grid;gap:16px;text-align:left;backdrop-filter:blur(3px)}
.card h2{font-size:30px;font-weight:400;text-align:center}
label{font-size:19px;display:grid;gap:6px}
input,textarea{font-family:'Cormorant Garamond','Lora',serif;font-size:19px;color:var(--ink);background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--ink)}
.seg{display:flex;gap:10px}
.seg button{flex:1;font-family:'Cormorant Garamond','Lora',serif;font-size:19px;padding:9px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.5);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:#f6f2ee;border-color:var(--ink)}
.err{color:#9b4b45;font-size:17px;min-height:1em;text-align:center}
.done{text-align:center;font-size:21px;line-height:1.6}
.center{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.hint{font-size:15px;color:var(--ink2);text-align:center}
.scroll{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:15px;color:var(--ink2);animation:b 2s infinite;transition:opacity .5s}
@keyframes b{50%{transform:translate(-50%,6px)}}

html{background:#ebe6e1}
body{background:transparent!important}
.seg button{min-width:0;padding:9px 4px}

/* compact: form always fits the screen */
main{padding:0 22px!important}
section{box-sizing:border-box}
section{min-height:100vh;min-height:100dvh;padding:14px 0}
.card{padding:18px 18px;gap:12px}
.card h2{font-size:26px;line-height:1.2}
label{font-size:17px;gap:4px}
#names{gap:8px!important}
input{font-size:17px;padding:8px 12px}
.seg{gap:8px}.seg button{font-size:17px;padding:7px 4px}
a.btn,button.btn{font-size:19px;padding:9px 26px}
.err{font-size:15px}
</style></head><body>
<main>
<section id="rsvp">
  <form class="card rev" id="f" novalidate>
    <h2>RSVP</h2>
    <div><label>Will you attend?</label>
      <div class="seg" id="att"><button type="button" data-v="yes">Accept</button><button type="button" data-v="no">Decline</button></div></div>
    <div id="cntw" style="display:none"><label>Number of guests</label>
      <div class="seg" id="cnt"><button type="button" data-v="1">1 guest</button><button type="button" data-v="2">2 guests</button></div></div>
    <div id="names" style="display:none;gap:14px">
      <label id="l1"><span id="l1t" hidden>Name</span><input id="n1" autocomplete="name" placeholder="Full name"></label>
      <label id="l2" style="display:none"><input id="n2" placeholder="Second guest’s full name"></label>
      
    </div>
    <div class="err" id="err"></div>
    <div class="center" id="acts" style="display:none">
      <button class="btn" type="submit" id="send">Confirm attendance</button>
    </div>
  </form>
  <div class="card" id="ok" style="display:none;text-align:center"><h2 id="okh">Thank you 🤍</h2><div class="done" id="okt">Your attendance is confirmed. We look forward to seeing you!</div></div>
</section>
</main>

<script>
var FIREBASE={apiKey:'AIzaSyBxzEKOQ8NrNqgeJp1XePLEsbEKXdXHla4',projectId:'my-wedding-cards',collection:'rsvp_hala_ali'};

const $=id=>document.getElementById(id);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rev').forEach(el=>io.observe(el));

let cnt=null, att=null;
function show(){
  const yes=att==='yes', no=att==='no';
  $('cntw').style.display=yes?'':'none';
  const n=no?1:(yes&&cnt?Number(cnt):0);
  $('names').style.display=n?'grid':'none'; $('acts').style.display=n?'flex':'none';
  for(let i=2;i<=2;i++) $('l'+i).style.display=n>=i?'':'none';
  $('n1').placeholder=n>1?'First guest’s full name':'Full name';
  $('send').textContent=no?'Send regrets':'Confirm attendance';
  $('err').textContent='';
}
$('att').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  att=b.dataset.v;[...$('att').children].forEach(c=>c.classList.toggle('on',c===b));show(); if(att==='no')$('n1').focus();});
$('cnt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  cnt=b.dataset.v;[...$('cnt').children].forEach(c=>c.classList.toggle('on',c===b));show();$('n1').focus();});

function check(){
  if(!att){$('err').textContent='Please let us know if you will attend';return false}
  if(att==='yes'&&!cnt){$('err').textContent='Please choose the number of guests';return false}
  const n=att==='no'?1:Number(cnt), lab=['','first','second','third'];
  for(let i=1;i<=n;i++){ if(!$('n'+i).value.trim()){
    $('err').textContent=n===1?'Please enter your name':'Please enter the '+lab[i]+' guest’s name'; $('n'+i).focus(); return false } }
  $('err').textContent='';return true}

function done(declined){ $('f').style.display='none'; $('ok').style.display='grid'; if(declined){$('okh').textContent='Thank you 🤍';$('okt').textContent='We received your regrets — we hope to celebrate with you soon';} }
const LS='rsvp_doc_'+FIREBASE.collection;
const BASE='https://firestore.googleapis.com/v1/projects/'+FIREBASE.projectId+'/databases/(default)/documents/'+FIREBASE.collection;
// already replied on this device? check the reply still exists in Firebase; if it was deleted, show the form again
(async()=>{ let id=null; try{ id=localStorage.getItem(LS); }catch(_){}
  if(!id) return;
  $('f').style.visibility='hidden';
  try{
    const r=await fetch(BASE+'/'+id+'?key='+FIREBASE.apiKey);
    if(r.ok){ let d=false; try{ const j=await r.json(); d=j.fields&&j.fields.attending&&j.fields.attending.booleanValue===false; }catch(_){} done(d); }
    else { try{ localStorage.removeItem(LS); }catch(_){} }
  }catch(_){}
  $('f').style.visibility='';
})();

$('f').addEventListener('submit',async e=>{
  e.preventDefault(); if(!check())return;
  const n=att==='no'?1:Number(cnt); const names=[1,2,3].slice(0,n).map(k=>$('n'+k).value.trim());
  $('send').disabled=true; $('send').textContent='Sending…';
  const url=BASE+'?key='+FIREBASE.apiKey;
  const body={fields:{
    attending:{booleanValue:att==='yes'},
    count:{integerValue:String(att==='yes'?Number(cnt):0)},
    names:{arrayValue:{values:names.map(n=>({stringValue:n}))}},
    name1:{stringValue:names[0]},
    name2:{stringValue:names[1]||''},
    createdAt:{timestampValue:new Date().toISOString()}
  }};
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(r.status+' '+await r.text());
    try{ const j=await r.json(); localStorage.setItem(LS,(j.name||'').split('/').pop()); }catch(_){}
    done(att==='no');
  }catch(err){
    console.error(err); $('err').textContent='Something went wrong, please try again';
    $('send').disabled=false; show();
  }
});
</script>
</body></html>
